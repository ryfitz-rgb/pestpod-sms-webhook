name: PestPod batch reminders

# Daily due nudge: batch.py texts customers whose Next Due falls in the current month, from the 1st (once per due cycle).
# GitHub cron is UTC and has no DST: 15:30 UTC = 10:30 AM CDT / 9:30 AM CST,
# 18:30 UTC = 1:30 PM CDT / 12:30 PM CST (idempotent retry in case the first run was late or failed).
on:
  schedule:
    - cron: "30 15 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (plan only, no texts, no sheet writes)"
        type: boolean
        default: true
      now:
        description: "Dry run only: simulate a Chicago time, e.g. 2026-11-01T10:00"
        required: false
        default: ""
      only_phone:
        description: "Limit to one phone (+1XXXXXXXXXX)"
        required: false
        default: ""
      force_wave:
        description: "1 = due nudge ignoring the Next Due window, 2 = appointment reminder (live requires only_phone)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pestpod-batch
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scheduled sends stay off until the repo variable PESTPOD_BATCH_ENABLED is "true".
    if: github.event_name == 'workflow_dispatch' || vars.PESTPOD_BATCH_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run batch
        env:
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          IN_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          IN_NOW: ${{ inputs.now }}
          IN_ONLY_PHONE: ${{ inputs.only_phone }}
          IN_FORCE_WAVE: ${{ inputs.force_wave }}
        run: |
          args=()
          [ "$IN_DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$IN_NOW" ] && args+=(--now "$IN_NOW")
          [ -n "$IN_ONLY_PHONE" ] && args+=(--only-phone "$IN_ONLY_PHONE")
          [ -n "$IN_FORCE_WAVE" ] && args+=(--force-wave "$IN_FORCE_WAVE")
          python batch.py "${args[@]}"
